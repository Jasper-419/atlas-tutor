services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas-local-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:${POSTGRES_PASSWORD:-atlas-local-change-me}@db:5432/atlas
      CHECKPOINT_DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:-atlas-local-change-me}@db:5432/atlas
      ATLAS_DATA_DIR: /app/data
      WORKER_MODE: celery
      REDIS_URL: redis://redis:6379/0
    volumes:
      - atlas_data:/app/data
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 8s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:${POSTGRES_PASSWORD:-atlas-local-change-me}@db:5432/atlas
      CHECKPOINT_DATABASE_URL: postgresql://atlas:${POSTGRES_PASSWORD:-atlas-local-change-me}@db:5432/atlas
      ATLAS_DATA_DIR: /app/data
      WORKER_MODE: celery
      REDIS_URL: redis://redis:6379/0
    command:
      [
        "celery",
        "-A",
        "backend.worker.celery_app",
        "worker",
        "--beat",
        "--loglevel=info",
        "--concurrency=2",
      ]
    volumes:
      - atlas_data:/app/data
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_URL: http://api:8000
    ports:
      - "${ATLAS_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  atlas_data:
